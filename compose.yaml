services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U repolens"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ./backend
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.tasks.celery worker --loglevel=info --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
